{
  "openapi": "3.0.1",
  "info": {
    "title": "RAG Chat Storage API",
    "description": "API for storing and managing RAG chat sessions",
    "version": "1.0"
  },
  "servers": [
    {
      "url": "http://localhost:8090"
    }
  ],
  "security": [
    {
      "ApiKeyAuth": []
    }
  ],
  "tags": [
    {
      "name": "Chat Session Management",
      "description": "APIs for managing chat sessions"
    },
    {
      "name": "Chat Message Management",
      "description": "APIs for managing chat messages within sessions"
    }
  ],
  "paths": {
    "/api/v1/sessions/{sessionId}": {
      "get": {
        "tags": [
          "Chat Session Management"
        ],
        "summary": "Get a specific chat session",
        "description": "Retrieves a specific chat session with its messages",
        "operationId": "getChatSession",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "description": "User ID from the authenticated request",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sessionId",
            "in": "path",
            "description": "Chat session ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Chat session retrieved successfully",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized - Invalid API key",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "404": {
            "description": "Chat session not found",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      },
      "put": {
        "tags": [
          "Chat Session Management"
        ],
        "summary": "Update a chat session",
        "description": "Updates the name of a chat session",
        "operationId": "updateChatSession",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "description": "User ID from the authenticated request",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sessionId",
            "in": "path",
            "description": "Chat session ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateChatSessionRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "401": {
            "description": "Unauthorized - Invalid API key",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "200": {
            "description": "Chat session updated successfully",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request data",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "404": {
            "description": "Chat session not found",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      },
      "delete": {
        "tags": [
          "Chat Session Management"
        ],
        "summary": "Delete a chat session",
        "description": "Deletes a chat session and all its messages",
        "operationId": "deleteChatSession",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "description": "User ID from the authenticated request",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sessionId",
            "in": "path",
            "description": "Chat session ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Unauthorized - Invalid API key"
          },
          "204": {
            "description": "Chat session deleted successfully"
          },
          "404": {
            "description": "Chat session not found"
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      }
    },
    "/api/v1/sessions": {
      "get": {
        "tags": [
          "Chat Session Management"
        ],
        "summary": "Get chat sessions",
        "description": "Retrieves chat sessions for the authenticated user with optional pagination, favorite filter, search, and stats.",
        "operationId": "getChatSessions",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 10
            }
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 0
            }
          },
          {
            "name": "favorite",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "search",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "includeStats",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "*/*": {
                "schema": {
                  "type": "object"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      },
      "post": {
        "tags": [
          "Chat Session Management"
        ],
        "summary": "Create a new chat session",
        "description": "Creates a new chat session for the authenticated user",
        "operationId": "createChatSession",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "description": "User ID from the authenticated request",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateChatSessionRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "401": {
            "description": "Unauthorized - Invalid API key",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "201": {
            "description": "Chat session created successfully",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request data",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      }
    },
    "/api/v1/sessions/{sessionId}/messages": {
      "get": {
        "tags": [
          "Chat Message Management"
        ],
        "summary": "Get messages in a chat session",
        "description": "Retrieves messages for a chat session with optional pagination, sender filter, latest, and count-only.",
        "operationId": "getMessages",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 20
            }
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 0
            }
          },
          {
            "name": "senderType",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "latest",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": false
            }
          },
          {
            "name": "countOnly",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "*/*": {
                "schema": {
                  "type": "object"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      },
      "post": {
        "tags": [
          "Chat Message Management"
        ],
        "summary": "Add a message to a chat session",
        "description": "Adds a new message to the specified chat session",
        "operationId": "addMessage",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "description": "User ID from the authenticated request",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sessionId",
            "in": "path",
            "description": "Chat session ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AddMessageRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Message added successfully",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatMessageDto"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized - Invalid API key",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatMessageDto"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request data",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatMessageDto"
                }
              }
            }
          },
          "404": {
            "description": "Chat session not found",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatMessageDto"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      }
    },
    "/api/v1/sessions/{sessionId}/favorite": {
      "patch": {
        "tags": [
          "Chat Session Management"
        ],
        "summary": "Toggle favorite status",
        "description": "Toggles the favorite status of a chat session",
        "operationId": "toggleFavorite",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "description": "User ID from the authenticated request",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sessionId",
            "in": "path",
            "description": "Chat session ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Unauthorized - Invalid API key",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "200": {
            "description": "Favorite status toggled successfully",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          },
          "404": {
            "description": "Chat session not found",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatSessionDto"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      }
    },
    "/api/v1/sessions/{sessionId}/messages/{messageId}": {
      "get": {
        "tags": [
          "Chat Message Management"
        ],
        "summary": "Get a specific message",
        "description": "Retrieves a specific message by ID from a chat session",
        "operationId": "getMessage",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "description": "User ID from the authenticated request",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sessionId",
            "in": "path",
            "description": "Chat session ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          },
          {
            "name": "messageId",
            "in": "path",
            "description": "Message ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Unauthorized - Invalid API key",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatMessageDto"
                }
              }
            }
          },
          "200": {
            "description": "Message retrieved successfully",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatMessageDto"
                }
              }
            }
          },
          "404": {
            "description": "Message or chat session not found",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ChatMessageDto"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      },
      "delete": {
        "tags": [
          "Chat Message Management"
        ],
        "summary": "Delete a specific message",
        "description": "Deletes a specific message from a chat session",
        "operationId": "deleteMessage",
        "parameters": [
          {
            "name": "X-User-ID",
            "in": "header",
            "description": "User ID from the authenticated request",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sessionId",
            "in": "path",
            "description": "Chat session ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          },
          {
            "name": "messageId",
            "in": "path",
            "description": "Message ID",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Unauthorized - Invalid API key"
          },
          "204": {
            "description": "Message deleted successfully"
          },
          "404": {
            "description": "Message or chat session not found"
          }
        },
        "security": [
          {
            "ApiKeyAuth": []
          }
        ]
      }
    }
  },
  "components": {
    "schemas": {
      "UpdateChatSessionRequest": {
        "required": [
          "name"
        ],
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          }
        }
      },
      "ChatMessageDto": {
        "required": [
          "chatSessionId",
          "content",
          "senderType"
        ],
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "chatSessionId": {
            "type": "integer",
            "format": "int64"
          },
          "senderType": {
            "type": "string",
            "enum": [
              "USER",
              "ASSISTANT"
            ]
          },
          "content": {
            "type": "string"
          },
          "context": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ChatSessionDto": {
        "required": [
          "isFavorite",
          "name",
          "userId"
        ],
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64"
          },
          "userId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "isFavorite": {
            "type": "boolean"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ChatMessageDto"
            }
          }
        }
      },
      "CreateChatSessionRequest": {
        "required": [
          "name"
        ],
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          }
        }
      },
      "AddMessageRequest": {
        "required": [
          "content",
          "senderType"
        ],
        "type": "object",
        "properties": {
          "senderType": {
            "type": "string",
            "enum": [
              "USER",
              "ASSISTANT"
            ]
          },
          "content": {
            "type": "string"
          },
          "context": {
            "type": "string"
          }
        }
      }
    },
    "securitySchemes": {
      "ApiKeyAuth": {
        "type": "apiKey",
        "description": "API Key needed to access the endpoints. Send as header X-API-KEY: \u003Ckey\u003E",
        "name": "X-API-KEY",
        "in": "header"
      }
    }
  }
}