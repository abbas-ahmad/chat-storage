server:
  port: ${PORT:8080}

spring:
  datasource:
    # allow overriding via SPRING_DATASOURCE_URL or fall back to compose/local defaults
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:chatdb}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# API key configuration (development default can be overridden with SECURITY_API_KEY env var)
security:
  api-key: ${SECURITY_API_KEY:api_9f3b2e7a-4d6c-4a1f-8b2e-123456789abc}

# Actuator and Distributed Tracing Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of requests (adjust for production: 0.1 = 10%)
  # Uncomment below if using Zipkin for trace visualization
  # zipkin:
  #   tracing:
  #     endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO
    store.chat_storage: DEBUG
    AUDIT: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId:-}, spanId=%X{spanId:-}] %-5level %logger{36} - %msg%n"

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
